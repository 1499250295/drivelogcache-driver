name: build-driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/Driver/**', '.github/workflows/**']

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download and mount EWDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?LinkId=2362109' -OutFile EWDK.iso
          $m = Mount-DiskImage -ImagePath (Resolve-Path EWDK.iso).Path -PassThru
          $vol = ($m | Get-Volume).DriveLetter
          "EWDK_DRIVE=$($vol):" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Build x64 Release
        shell: cmd
        run: |
          call %EWDK_DRIVE%\LaunchBuildEnv.cmd
          msbuild src\Driver\drivelogcache.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=%CD%\out\ /p:IntDir=%CD%\out\obj\ /m /v:m

      - name: Check output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path 'out\drivelogcache.sys')) { throw 'drivelogcache.sys not produced' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-x64-release
          path: |
            out/drivelogcache.sys
            out/drivelogcache.inf
            out/*.cer
          if-no-files-found: error
